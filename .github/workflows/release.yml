# ==============================================================================
# RELEASE
# ==============================================================================
# release-please keeps a Release PR on `master`; merging it tags the release.
# The org tag ruleset requires the GitHub App token that use-app-token mints.
# ==============================================================================
name: Release

# ==============================================================================
# TRIGGER
# ==============================================================================
on:
    push:
        branches: [ master ]

# ==============================================================================
# CONCURRENCY
# ==============================================================================
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

# ==============================================================================
# PERMISSIONS
# ==============================================================================
permissions:
    contents: write
    pull-requests: write

jobs:

    # ==========================================================================
    # JOB: RELEASE
    # ==========================================================================
    release:
        uses: sinemacula/.github/.github/workflows/release.yml@v2.0.0
        secrets: inherit
        with:
            use-app-token: true
