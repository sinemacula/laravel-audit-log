# Reference: https://qlty.sh/d/qlty-toml
#
# Plugins and rules come from the shared sinemacula/coding-standards source.
config_version = "0"

exclude_patterns = [
    "*_min.*",
    "*-min.*",
    "*.min.*",
    "**/build/**",
    "**/cache/**",
    "**/coverage/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/vendor/**",
    ".claude/**",
    ".qlty/configs/**",
    ".sinemacula/**",
]

test_patterns = [
    "**/test/**",
    "**/tests/**",
    "**/spec/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/test_*.*",
    "**/spec_*.*",
]

[[source]]
name = "default"
default = true

[[source]]
name = "sinemacula"
repository = "https://github.com/sinemacula/coding-standards"
tag = "v1.30.0"

[[plugin]]
name = "php-codesniffer"
package_file = "composer.json"
package_filters = ["slevomat", "dealerdirect", "sinemacula"]

# qlty silently ignores extra_packages whenever package_file is set, so this
# plugin declares its packages instead of reading composer.json.
[[plugin]]
name = "php-cs-fixer"
extra_packages = ["sinemacula/coding-standards@1.30.0"]

# The sandbox file lists the analysis stack and every dependency the code
# references: add a new dependency there as well as to composer.json.
[[plugin]]
name = "phpstan"
package_file = ".qlty/configs/composer.json"
